<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VideoEdit - Éditeur Vidéo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Page d'accueil - Import -->
    <div class="home-screen" id="home-screen">
        <div class="home-content">
            <div class="home-logo">
                <i class="fas fa-film"></i>
                <h1>VideoEdit</h1>
            </div>
            <p class="home-subtitle">Éditeur vidéo simple et rapide</p>
            <button class="import-button" id="import-btn">
                <i class="fas fa-plus"></i>
                <span>Importer votre vidéo</span>
            </button>
            <p class="home-formats">MP4, WebM, MOV, AVI, MKV</p>
        </div>
        <input type="file" id="file-input" accept="video/*,.avi,.mkv,.mov,.wmv,.flv" hidden>
    </div>

    <!-- Éditeur - Caché par défaut -->
    <div class="editor-screen" id="editor-screen">
        <!-- Header -->
        <header class="editor-header">
            <button class="header-btn" id="back-btn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="header-actions">
                <button class="header-btn" id="undo-btn">
                    <i class="fas fa-undo"></i>
                </button>
                <button class="header-btn" id="redo-btn">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            <button class="export-btn" id="export-btn">
                <i class="fas fa-download"></i>
            </button>
        </header>

        <!-- Zone de prévisualisation -->
        <div class="preview-area" id="preview-area">
            <video id="preview-video" playsinline></video>
            <!-- Bouton orientation -->
            <button class="orientation-btn" id="orientation-btn" title="Changer l'orientation">
                <i class="fas fa-mobile-alt"></i>
            </button>
        </div>

        <!-- Contrôles de lecture -->
        <div class="playback-controls">
            <span class="time-display">
                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </span>
            <button class="play-btn" id="play-btn">
                <i class="fas fa-play"></i>
            </button>
            <button class="fullscreen-btn" id="fullscreen-btn">
                <i class="fas fa-expand"></i>
            </button>
        </div>

        <!-- Contrôles timeline -->
        <div class="timeline-controls">
            <button class="timeline-ctrl-btn" id="settings-btn">
                <i class="fas fa-sliders-h"></i>
            </button>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-out">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="zoom-btn" id="zoom-in">
                    <i class="fas fa-plus"></i>
                </button>
                <button class="zoom-btn" id="zoom-fit">
                    <i class="fas fa-compress-arrows-alt"></i>
                </button>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline-container" id="timeline-container">
            <div class="time-ruler" id="time-ruler"></div>
            <div class="timeline-tracks-wrapper" id="timeline-tracks-wrapper">
                <!-- Curseur de position -->
                <div class="cut-cursor" id="cut-cursor">
                    <div class="cut-cursor-line"></div>
                </div>
                <!-- Playhead -->
                <div class="playhead" id="playhead"></div>
                <!-- Piste vidéo 1 -->
                <div class="timeline-track" id="track-0" data-track="0">
                    <div class="track-label">Vidéo 1</div>
                </div>
                <!-- Piste vidéo 2 -->
                <div class="timeline-track" id="track-1" data-track="1">
                    <div class="track-label">Vidéo 2</div>
                </div>
                <!-- Piste audio -->
                <div class="timeline-track audio-track" id="track-2" data-track="2">
                    <div class="track-label">Audio</div>
                </div>
            </div>
        </div>

        <!-- Menu radial flottant -->
        <div class="fab-container" id="fab-container">
            <button class="fab-main" id="fab-main">
                <i class="fas fa-plus"></i>
            </button>
            <div class="fab-menu" id="fab-menu">
                <button class="fab-item" data-tool="split" data-label="Diviser">
                    <i class="fas fa-cut"></i>
                </button>
                <button class="fab-item" data-tool="speed" data-label="Vitesse">
                    <i class="fas fa-tachometer-alt"></i>
                </button>
                <button class="fab-item" data-tool="delete" data-label="Supprimer">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="fab-item" data-tool="adjust" data-label="Ajuster">
                    <i class="fas fa-sliders-h"></i>
                </button>
                <button class="fab-item" data-tool="filters" data-label="Filtres">
                    <i class="fas fa-palette"></i>
                </button>
                <button class="fab-item" data-tool="audio" data-label="Audio">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Export -->
    <div class="modal" id="export-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Exporter</h3>
                <button class="close-btn" id="close-export">&times;</button>
            </div>
            <div class="modal-body">
                <div class="export-option">
                    <label>Format</label>
                    <select id="export-format">
                        <option value="mp4">MP4</option>
                        <option value="webm">WebM</option>
                    </select>
                </div>
                <div class="export-option">
                    <label>Qualité</label>
                    <select id="export-quality">
                        <option value="4k">4K (2160p)</option>
                        <option value="1080p" selected>1080p (Full HD)</option>
                        <option value="720p">720p (HD)</option>
                        <option value="480p">480p (SD)</option>
                    </select>
                </div>
                <div class="export-progress" id="export-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <span id="progress-text">0%</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="start-export">Exporter</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
