<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VideoEdit - Éditeur Vidéo</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Page d'accueil - Import -->
    <div class="home-screen" id="home-screen">
        <div class="home-content">
            <div class="home-logo">
                <i class="fas fa-film"></i>
                <h1>VideoEdit</h1>
            </div>
            <p class="home-subtitle">Éditeur vidéo simple et rapide</p>
            <button class="import-button" id="import-btn">
                <i class="fas fa-plus"></i>
                <span>Importer votre vidéo</span>
            </button>
            <p class="home-formats">MP4, WebM, MOV, AVI, MKV</p>
        </div>
        <input type="file" id="file-input" accept="video/*,.avi,.mkv,.mov,.wmv,.flv" hidden>
    </div>

    <!-- Éditeur - Caché par défaut -->
    <div class="editor-screen" id="editor-screen">
        <!-- Header -->
        <header class="editor-header">
            <button class="header-btn" id="back-btn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="header-actions">
                <button class="header-btn" id="undo-btn">
                    <i class="fas fa-undo"></i>
                </button>
                <button class="header-btn" id="redo-btn">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            <button class="export-btn" id="export-btn">
                <i class="fas fa-download"></i>
            </button>
        </header>

        <!-- Zone de prévisualisation -->
        <div class="preview-area">
            <video id="preview-video" playsinline></video>
        </div>

        <!-- Contrôles de lecture -->
        <div class="playback-controls">
            <span class="time-display">
                <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
            </span>
            <button class="play-btn" id="play-btn">
                <i class="fas fa-play"></i>
            </button>
            <button class="fullscreen-btn" id="fullscreen-btn">
                <i class="fas fa-expand"></i>
            </button>
        </div>

        <!-- Contrôles timeline -->
        <div class="timeline-controls">
            <button class="timeline-ctrl-btn" id="settings-btn">
                <i class="fas fa-sliders-h"></i>
            </button>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-out">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="zoom-btn" id="zoom-in">
                    <i class="fas fa-plus"></i>
                </button>
                <button class="zoom-btn" id="zoom-fit">
                    <i class="fas fa-compress-arrows-alt"></i>
                </button>
            </div>
        </div>

        <!-- Timeline -->
        <div class="timeline-container" id="timeline-container">
            <div class="time-ruler" id="time-ruler"></div>
            <div class="timeline-tracks-wrapper" id="timeline-tracks-wrapper">
                <!-- Curseur ciseau -->
                <div class="scissor-cursor" id="scissor-cursor">
                    <i class="fas fa-cut"></i>
                    <div class="scissor-line"></div>
                </div>
                <!-- Playhead -->
                <div class="playhead" id="playhead"></div>
                <!-- Piste vidéo 1 -->
                <div class="timeline-track" id="track-0" data-track="0">
                    <div class="track-label">Vidéo 1</div>
                </div>
                <!-- Piste vidéo 2 -->
                <div class="timeline-track" id="track-1" data-track="1">
                    <div class="track-label">Vidéo 2</div>
                </div>
                <!-- Piste audio -->
                <div class="timeline-track audio-track" id="track-2" data-track="2">
                    <div class="track-label">Audio</div>
                </div>
            </div>
        </div>

        <!-- Barre d'outils du bas -->
        <div class="bottom-toolbar">
            <button class="tool-btn" data-tool="split">
                <i class="fas fa-cut"></i>
                <span>Diviser</span>
            </button>
            <button class="tool-btn" data-tool="adjust">
                <i class="fas fa-sliders-h"></i>
                <span>Ajuster</span>
            </button>
            <button class="tool-btn" data-tool="speed">
                <i class="fas fa-tachometer-alt"></i>
                <span>Vitesse</span>
            </button>
            <button class="tool-btn" data-tool="delete">
                <i class="fas fa-trash"></i>
                <span>Supprimer</span>
            </button>
            <button class="tool-btn" data-tool="transform">
                <i class="fas fa-crop"></i>
                <span>Transf.</span>
            </button>
            <button class="more-btn" id="more-tools-btn">
                <i class="fas fa-chevron-down"></i>
            </button>
        </div>

        <!-- Panel d'outils supplémentaires (caché par défaut) -->
        <div class="tools-panel" id="tools-panel">
            <div class="tools-panel-content">
                <button class="panel-tool-btn" data-tool="filters">
                    <i class="fas fa-palette"></i>
                    <span>Filtres</span>
                </button>
                <button class="panel-tool-btn" data-tool="text">
                    <i class="fas fa-font"></i>
                    <span>Texte</span>
                </button>
                <button class="panel-tool-btn" data-tool="audio">
                    <i class="fas fa-volume-up"></i>
                    <span>Audio</span>
                </button>
                <button class="panel-tool-btn" data-tool="rotate">
                    <i class="fas fa-sync"></i>
                    <span>Rotation</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Export -->
    <div class="modal" id="export-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Exporter</h3>
                <button class="close-btn" id="close-export">&times;</button>
            </div>
            <div class="modal-body">
                <div class="export-option">
                    <label>Format</label>
                    <select id="export-format">
                        <option value="mp4">MP4</option>
                        <option value="webm">WebM</option>
                    </select>
                </div>
                <div class="export-option">
                    <label>Qualité</label>
                    <select id="export-quality">
                        <option value="1080p">1080p</option>
                        <option value="720p">720p</option>
                        <option value="480p">480p</option>
                    </select>
                </div>
                <div class="export-progress" id="export-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <span id="progress-text">0%</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="start-export">Exporter</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
